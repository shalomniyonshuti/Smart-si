name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: echo "::notice title=Repo files::$(ls -la | tr '\n' '|')"

      - name: Unzip project
        run: |
          mkdir -p _src
          python3 -m zipfile -e SmartTranslate.zip _src > $GITHUB_WORKSPACE/log.txt 2>&1 || { echo "::error title=Unzip failed::$(tr '\n' '|' < $GITHUB_WORKSPACE/log.txt)"; exit 1; }
          echo "::notice title=Unzipped::$(find _src -maxdepth 3 | tr '\n' '|')"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          DIR=$(dirname "$(find _src -name settings.gradle.kts | head -1)")
          cd "$DIR"
          gradle assembleDebug > $GITHUB_WORKSPACE/build-log.txt 2>&1 || { echo "::error title=Build failed::$(grep -E 'e: |What went wrong|error:|FAILED' -A3 $GITHUB_WORKSPACE/build-log.txt | head -30 | tr '\n' '|')"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: SmartTranslate-APK
          path: _src/**/app-debug.apk
